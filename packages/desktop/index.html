<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sonst bleibt unter der Dynamic Island und über der
         Home-Leiste ein schwarzer Balken statt Inhalt. Das Freihalten
         übernimmt das Stylesheet über env(safe-area-inset-*). -->
    <!-- interactive-widget=resizes-content: geht die Tastatur auf, soll das
         Fenster selbst kleiner werden. Ohne diese Angabe bleibt die Fensterhöhe
         stehen, 100dvh am .rahmen bleibt also gross, und iOS verschiebt
         stattdessen die ganze Seite nach oben, um das Schreibfeld freizulegen —
         danach steht der Composer mal hier, mal dort. Mit der Angabe schrumpft
         100dvh, die Nachrichtenliste wird kürzer und das Schreibfeld sitzt von
         selbst über der Tastatur. Achtung: die Wirkung mit echter Tastatur ist
         hier NICHT geprüft — ein Prüflauf ohne Gerät hat keine. Maschinen, die
         die Angabe nicht kennen, überlesen sie folgenlos. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
    <!-- Dieselbe Farbe wie der Seitenrand (--grund-rand). iOS tönt damit die
         Leisten um die Seite; steht hier ein anderer Wert, entsteht genau der
         dunkle Streifen unter dem Schreibfeld, den wir lange gejagt haben. -->
    <meta name="theme-color" content="#172736" />
    <meta name="color-scheme" content="dark light" />

    <!-- Zum Startbildschirm hinzufügen: Android liest das Manifest, iOS die
         drei apple-Zeilen darunter. Ohne sie hieße das Symbol wie die Seite
         und öffnete sich weiter im Browser mit Adressleiste. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-2.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stellium Chat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Stellium Chat" />
    <!--CSP-->
    <title>Stellium</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
