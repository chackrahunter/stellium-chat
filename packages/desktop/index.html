<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- KEIN viewport-fit=cover, und das ist Absicht. Es stand hier, damit
         unter der Dynamic Island und über der Home-Leiste kein schwarzer
         Balken bleibt — auf iOS 26 löst es aber WebKit-Fehler #301994 aus:
         die Startbildschirm-App bekommt einen um die Statusleistenhöhe
         verkleinerten Ausschnitt, festgenagelt am OBEREN Schirmrand, und die
         untersten 62 Punkte sind tot. Ohne `cover` reicht der Ausschnitt bis
         zur letzten Bildschirmzeile.
         Der Preis: env(safe-area-inset-*) meldet damit überall 0. Wer unten
         etwas freihalten muss, nimmt --wischzone aus lib/sichere-bereiche.ts
         (in mobil.css als --rand-unten gebündelt) — nicht --sicher-unten. -->
    <!-- Kein user-scalable=no. Es stand hier, damit iOS beim Antippen eines
         Eingabefeldes nicht hineinzoomt — aber es sperrt damit auch alle aus,
         die zum Lesen vergrößern müssen, und gilt als Barrierefreiheits-
         Verstoß. Das eigentliche Mittel gegen das Zoomen ist eine Schriftgröße
         von mindestens 16px im Eingabefeld, und die steht ohnehin da
         (.composer__input). Zwei Lösungen für dasselbe Problem, von denen eine
         schadet — also die weg. -->
    <!-- interactive-widget=resizes-content: geht die Tastatur auf, soll das
         Fenster selbst kleiner werden. Ohne diese Angabe bleibt die Fensterhöhe
         stehen, 100dvh am .rahmen bleibt also gross, und iOS verschiebt
         stattdessen die ganze Seite nach oben, um das Schreibfeld freizulegen —
         danach steht der Composer mal hier, mal dort. Mit der Angabe schrumpft
         100dvh, die Nachrichtenliste wird kürzer und das Schreibfeld sitzt von
         selbst über der Tastatur. Achtung: das versteht nur Chromium/Android —
         iOS Safari ignoriert die Angabe und legt die Tastatur weiter ÜBER die
         Seite; dort gleicht lib/tastatur.ts das über visualViewport und die
         Variable --vv-hoehe aus. Maschinen, die die Angabe nicht kennen,
         überlesen sie folgenlos. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- Dieselbe Farbe wie der Seitenrand (--grund-rand). iOS tönt damit die
         Leisten um die Seite; steht hier ein anderer Wert, entsteht genau der
         dunkle Streifen unter dem Schreibfeld, den wir lange gejagt haben. -->
    <meta name="theme-color" content="#172736" />
    <meta name="color-scheme" content="dark light" />
    <style>
      /* Die zweite Haelfte des weissen Blitzes.

         Die Startbilder weiter unten decken den Startschirm des Systems ab.
         Danach uebergibt iOS an die Webansicht — und die ist weiss, bis das
         Stylesheet da ist. Im Bildbeleg waren das drei Vollbilder Weiss
         DIREKT NACH dem dunklen Startbild, also genau in der Luecke, die ein
         Startbild grundsaetzlich nicht schliessen kann.

         Diese Zeile schliesst sie, weil sie im HTML steht und damit gilt,
         sobald der Kopf gelesen ist — kein Netzweg, kein Warten. Sie darf
         danach nichts festhalten: app.css setzt den Grund von html mit dem
         Randverlauf neu, und der <link> darauf steht weiter unten im Kopf
         (vite haengt ihn ans Ende). Gleiche Spezifitaet, spaeter im Kopf —
         also gewinnt app.css, sobald es da ist. Kein !important, genau
         deshalb.

         Die Farbe ist --grund-rand, dieselbe wie in theme-color, im Manifest
         und in den Startbildern. Vier Stellen, eine Farbe: steht hier ein
         anderer Wert, sieht man den Sprung. */
      html { background: #172736; }
    </style>

    <!-- Zum Startbildschirm hinzufügen: Android liest das Manifest, iOS die
         drei apple-Zeilen darunter. Ohne sie hieße das Symbol wie die Seite
         und öffnete sich weiter im Browser mit Adressleiste. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-2.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stellium Chat" />
    <!-- Startbilder: gegen den weissen Blitz beim Kaltstart.

         Vom Startbildschirm zeigt iOS erst einen leeren Startschirm und dann
         die Seite. Ohne diese Zeilen ist dieser Startschirm WEISS — gegen
         eine durchweg dunkle App ein Blitz ueber den ganzen Bildschirm.
         `background_color` im Manifest hilft nicht: das liest Android, iOS
         nicht. iOS liest nur `apple-touch-startup-image`, und nur ein Bild,
         dessen Masse GENAU passen; alles andere ueberspringt es wortlos und
         nimmt wieder Weiss. Daher eine Zeile je Geraet und Lage.

         Die Bilder sind einfarbig in --grund-rand (#172736, dieselbe Farbe
         wie `theme-color` darueber) und rund ein halbes Kilobyte gross.
         Erzeugt und die Zeilen hier ausgegeben von:

             node scripts/startbilder-erzeugen.mjs
             node scripts/startbilder-erzeugen.mjs --links

         Die Geraeteliste steht dort, nicht hier — sonst muesste man sie beim
         naechsten Geraet an zwei Stellen nachtragen. -->
    <link rel="apple-touch-startup-image" href="/start/1320x2868.png"
          media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/start/2868x1320.png"
          media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />  <!-- iPhone 16/17 Pro Max -->

          media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/start/2796x1290.png"
          media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />  <!-- iPhone 14/15 Pro Max, 15/16 Plus -->
    <link rel="apple-touch-startup-image" href="/start/1284x2778.png"

    <link rel="apple-touch-startup-image" href="/start/2778x1284.png"
